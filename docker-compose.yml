version: "3.8"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openscout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openscoutpass}
      POSTGRES_DB: ${POSTGRES_DB:-openscout}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  openscout:
    build: ./backend
    image: openscout:local
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "${HOST_HTTP_PORT:-8080}:${APP_PORT}"
    restart: unless-stopped

  analyzer:
    build: ./ai
    image: openscout-analyzer:local
    env_file:
      - .env
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db-data:
